<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI Tuner 测试页</title>
    <style>
      :root {
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: #18181b;
        background: #fafafa;
      }
      body {
        max-width: 720px;
        margin: 0 auto;
        padding: 48px 24px;
      }
      nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 32px;
      }
      .brand {
        font-weight: 700;
        font-size: 16px;
      }
      .nav-links {
        display: flex;
        gap: 16px;
        font-size: 13px;
        color: #52525b;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 8px;
      }
      .subtitle {
        color: #52525b;
        font-size: 14px;
        margin: 0 0 32px;
      }
      .card {
        background: #fff;
        border: 1px solid #e4e4e7;
        border-radius: 12px;
        padding: 24px;
        margin-bottom: 16px;
      }
      .card h2 {
        font-size: 16px;
        margin: 0 0 12px;
      }
      .price {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .price-note {
        font-size: 12px;
        color: #a1a1aa;
        margin-bottom: 16px;
      }
      ul.features {
        list-style: none;
        padding: 0;
        margin: 0 0 20px;
        font-size: 13px;
        color: #3f3f46;
      }
      ul.features li {
        padding: 6px 0;
      }
      button {
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        padding: 8px 16px;
        border-radius: 8px;
        border: 1px solid #18181b;
        cursor: pointer;
      }
      button.primary {
        background: #18181b;
        color: #fff;
      }
      button.ghost {
        background: transparent;
        color: #18181b;
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      .form-row {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 12px;
      }
      .form-row label {
        font-size: 12px;
        color: #52525b;
      }
      .form-row input {
        font: inherit;
        font-size: 13px;
        padding: 8px 12px;
        border: 1px solid #d4d4d8;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <nav>
      <span class="brand">Acme</span>
      <span class="nav-links">
        <span>产品</span>
        <span>文档</span>
        <span>定价</span>
      </span>
    </nav>

    <h1>UI Tuner 测试页</h1>
    <p class="subtitle">
      用于验证扩展与 localhost 页面的通信；M2 起作为 Element Picker 的练手页面。
    </p>

    <section class="card">
      <h2>Pro</h2>
      <p class="price">
        ¥ 68<span style="font-size: 13px; font-weight: 400; color: #a1a1aa"> /月</span>
      </p>
      <p class="price-note">按年付费可省 20%</p>
      <ul class="features">
        <li>✓ 无限项目</li>
        <li>✓ 团队协作</li>
        <li>✓ 优先支持</li>
      </ul>
      <div class="actions">
        <button class="primary">立即订阅</button>
        <button class="ghost">了解更多</button>
      </div>
    </section>

    <section class="card">
      <h2>联系我们</h2>
      <div class="form-row">
        <label for="email">邮箱</label>
        <input id="email" type="email" placeholder="you@example.com" />
      </div>
      <div class="form-row">
        <label for="message">留言</label>
        <input id="message" type="text" placeholder="想了解什么？" />
      </div>
      <div class="actions">
        <button class="primary">发送</button>
      </div>
    </section>
  </body>
</html>
